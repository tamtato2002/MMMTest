name: Build Death Evolution (Minecraft 1.12.2)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 4.10.3 (ForgeGradle 3.x compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '4.10.3'

      - name: Show toolchain
        run: java -version && gradle --version

      - name: Build mod
        run: gradle build --no-daemon --stacktrace --refresh-dependencies

      - name: Upload built mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeathEvolution-1.1.0
          path: build/libs/DeathEvolution-1.1.0.jar
          if-no-files-found: error
          retention-days: 14
